server:
  port: 8123
  servlet:
    context-path: /api

spring:
  application:
    name: kuncode-picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/kuncode_picture
    username: root
    password: 123

mybatis-plus:
  configuration:
    # 驼峰配置
    map-underscore-to-camel-case: false
    # 开发环境打印 Sql 日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除
      logic-delete-field: isDelete # 逻辑删除名
      logic-delete-value: 1 # 已删除参数
      logic-not-delete-value: 0 # 未删除参数

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 接口文档
    version: 1.0.0
    group:
      default:
        api-rule: package
        api-rule-resources:
          - com.kuncode.kuncodepicturebackend.controller




